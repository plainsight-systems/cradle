name: Check Cradle
on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:
permissions:
  contents: read
jobs:
  build-and-test:
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-24.04, windows-2025, macos-15]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.14.5'
      - uses: actions/setup-dotnet@v4
        with:
          global-json-file: global.json
      - name: Prepare dependencies, build all backends, and run CPU-side tests
        run: python scripts/check_dotnet.py
