<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="title desc"><title id="title">Inner loop: pair values and accumulate</title><desc id="desc">Row and column stay zero. For i zero, read left[0,0]=1 and right[0,0]=7; sum becomes 7. For i one read 2 and 9; sum becomes 25. For i two read 3 and 11; sum becomes 58. Highlighted cells advance across the left row and down the right column. Finally store 58 in result[0,0].</desc>
