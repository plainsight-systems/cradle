<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 850" role="img" aria-labelledby="title desc"><title id="title">One launch, four invocations</title><desc id="desc">A CPU launch with a 2 by 2 extent fans out to four invocations of the same compiled kernel. Each has a distinct index, its own loop and sum, and writes one output element.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172f46"/></marker></defs><rect width="900" height="850" rx="14" fill="#fbf8f0"/><g font-family="IBM Plex Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172f46" text-anchor="start" font-weight="bold">One launch requests four invocations</text><rect x="70" y="80" width="760" height="112" rx="10" fill="#172f46" stroke="#172f46" stroke-width="2"/><text x="100" y="115" font-size="23" fill="#fbf8f0" text-anchor="start" font-weight="normal">CPU submits work to the stream</text><text x="100" y="159" font-size="28" fill="#fbf8f0" text-anchor="start" font-weight="normal">Launch(new Index2D(2, 2), ...)</text><path d="M450 192 V220" fill="none" stroke="#172f46" stroke-width="3" marker-end="url(#arrow)"/><rect x="180" y="224" width="540" height="58" rx="10" fill="#eee8d8" stroke="#9b7028" stroke-width="2"/><text x="450" y="261" font-size="25" fill="#172f46" text-anchor="middle" font-weight="normal">GPU: same compiled MultiplyMatrices</text><path d="M450 282 V305" fill="none" stroke="#172f46" stroke-width="3"/><path d="M30 305 H870" fill="none" stroke="#172f46" stroke-width="3"/><path d="M240 305 V345" fill="none" stroke="#172f46" stroke-width="3" marker-end="url(#arrow)"/><path d="M660 305 V345" fill="none" stroke="#172f46" stroke-width="3" marker-end="url(#arrow)"/><path d="M30 305 V535 H240 V565" fill="none" stroke="#172f46" stroke-width="3" marker-end="url(#arrow)"/><path d="M870 305 V535 H660 V565" fill="none" stroke="#172f46" stroke-width="3" marker-end="url(#arrow)"/><rect x="70" y="350" width="340" height="160" rx="10" fill="white" stroke="#405c95" stroke-width="2"/><text x="92" y="386" font-size="27" fill="#405c95" text-anchor="start" font-weight="bold">index = (0, 0)</text><text x="92" y="423" font-size="22" fill="#172f46" text-anchor="start" font-weight="normal">Own sum; loop i = 0, 1, 2</text><rect x="87" y="444" width="306" height="48" rx="6" fill="#f4f5f4" stroke="#405c95" stroke-width="2"/><text x="240" y="476" font-size="26" fill="#405c95" text-anchor="middle" font-weight="normal">output[0] = 58</text><rect x="490" y="350" width="340" height="160" rx="10" fill="white" stroke="#167779" stroke-width="2"/><text x="512" y="386" font-size="27" fill="#167779" text-anchor="start" font-weight="bold">index = (0, 1)</text><text x="512" y="423" font-size="22" fill="#172f46" text-anchor="start" font-weight="normal">Own sum; loop i = 0, 1, 2</text><rect x="507" y="444" width="306" height="48" rx="6" fill="#f4f5f4" stroke="#167779" stroke-width="2"/><text x="660" y="476" font-size="26" fill="#167779" text-anchor="middle" font-weight="normal">output[1] = 64</text><rect x="70" y="570" width="340" height="160" rx="10" fill="white" stroke="#9b7028" stroke-width="2"/><text x="92" y="606" font-size="27" fill="#9b7028" text-anchor="start" font-weight="bold">index = (1, 0)</text><text x="92" y="643" font-size="22" fill="#172f46" text-anchor="start" font-weight="normal">Own sum; loop i = 0, 1, 2</text><rect x="87" y="664" width="306" height="48" rx="6" fill="#f4f5f4" stroke="#9b7028" stroke-width="2"/><text x="240" y="696" font-size="26" fill="#9b7028" text-anchor="middle" font-weight="normal">output[2] = 139</text><rect x="490" y="570" width="340" height="160" rx="10" fill="white" stroke="#9c493a" stroke-width="2"/><text x="512" y="606" font-size="27" fill="#9c493a" text-anchor="start" font-weight="bold">index = (1, 1)</text><text x="512" y="643" font-size="22" fill="#172f46" text-anchor="start" font-weight="normal">Own sum; loop i = 0, 1, 2</text><rect x="507" y="664" width="306" height="48" rx="6" fill="#f4f5f4" stroke="#9c493a" stroke-width="2"/><text x="660" y="696" font-size="26" fill="#9c493a" text-anchor="middle" font-weight="normal">output[3] = 154</text><text x="450" y="780" font-size="23" fill="#172f46" text-anchor="middle" font-weight="normal">Logical work: each coordinate owns one output.</text><text x="450" y="815" font-size="21" fill="#536475" text-anchor="middle" font-weight="normal">Hardware chooses the execution order and scheduling.</text></g></svg>