<text x="40" y="101" font-size="25" fill="#172f46" text-anchor="start" font-weight="700">Left: 2 × 3</text>
<text x="365" y="101" font-size="25" fill="#172f46" text-anchor="start" font-weight="700">Right: 3 × 2</text>
<text x="655" y="101" font-size="25" fill="#172f46" text-anchor="start" font-weight="700">Result: 2 × 2</text>
