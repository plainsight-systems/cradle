<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 470" role="img" aria-labelledby="title desc"><title id="title">A row and a column make one answer</title><desc id="desc">The first left row 1,2,3 and first right column 7,9,11 are highlighted. Their three paired products sum to 58 in the top-left output. The left matrix is 2 by 3, the right is 3 by 2, and the result is 2 by 2.</desc>
<rect x="1" y="1" width="898" height="468" rx="7" fill="#fbf8f0" stroke="#fbf8f0" stroke-width="2"/>
<g font-family="IBM Plex Sans, Arial, sans-serif">
