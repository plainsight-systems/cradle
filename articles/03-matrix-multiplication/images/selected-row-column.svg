<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 690" role="img" aria-labelledby="title desc"><title id="title">The row and column read by invocation 1,0</title><desc id="desc">The second row of the left matrix, values 4,5,6, and the first column of the right matrix, values 7,9,11, feed a dot product whose value 139 is written to output array index 2.</desc><defs><marker id="arrow" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M 0 0 L 10 5 L 0 10 z" fill="#172f46"/></marker></defs><rect width="900" height="690" rx="14" fill="#fbf8f0"/><g font-family="IBM Plex Sans, Arial, sans-serif"><text x="40" y="48" font-size="30" fill="#172f46" text-anchor="start" font-weight="bold">Zoom in: invocation (1, 0)</text><text x="90" y="100" font-size="25" fill="#9b7028" text-anchor="start" font-weight="bold">Left: select row 1</text><text x="500" y="100" font-size="25" fill="#167779" text-anchor="start" font-weight="bold">Right: select column 0</text><rect x="90" y="135" width="70" height="66" rx="6" fill="white" stroke="#c7cdd0" stroke-width="2"/><text x="125" y="179" font-size="30" fill="#536475" text-anchor="middle" font-weight="normal">1</text><rect x="168" y="135" width="70" height="66" rx="6" fill="white" stroke="#c7cdd0" stroke-width="2"/><text x="203" y="179" font-size="30" fill="#536475" text-anchor="middle" font-weight="normal">2</text><rect x="246" y="135" width="70" height="66" rx="6" fill="white" stroke="#c7cdd0" stroke-width="2"/><text x="281" y="179" font-size="30" fill="#536475" text-anchor="middle" font-weight="normal">3</text><rect x="90" y="209" width="70" height="66" rx="6" fill="#efe1ba" stroke="#9b7028" stroke-width="2"/><text x="125" y="253" font-size="30" fill="#9b7028" text-anchor="middle" font-weight="bold">4</text><rect x="168" y="209" width="70" height="66" rx="6" fill="#efe1ba" stroke="#9b7028" stroke-width="2"/><text x="203" y="253" font-size="30" fill="#9b7028" text-anchor="middle" font-weight="bold">5</text><rect x="246" y="209" width="70" height="66" rx="6" fill="#efe1ba" stroke="#9b7028" stroke-width="2"/><text x="281" y="253" font-size="30" fill="#9b7028" text-anchor="middle" font-weight="bold">6</text><rect x="535" y="135" width="70" height="66" rx="6" fill="#d9eeeb" stroke="#167779" stroke-width="2"/><text x="570" y="179" font-size="30" fill="#167779" text-anchor="middle" font-weight="bold">7</text><rect x="613" y="135" width="70" height="66" rx="6" fill="white" stroke="#c7cdd0" stroke-width="2"/><text x="648" y="179" font-size="30" fill="#536475" text-anchor="middle" font-weight="normal">8</text><rect x="535" y="209" width="70" height="66" rx="6" fill="#d9eeeb" stroke="#167779" stroke-width="2"/><text x="570" y="253" font-size="30" fill="#167779" text-anchor="middle" font-weight="bold">9</text><rect x="613" y="209" width="70" height="66" rx="6" fill="white" stroke="#c7cdd0" stroke-width="2"/><text x="648" y="253" font-size="30" fill="#536475" text-anchor="middle" font-weight="normal">10</text><rect x="535" y="283" width="70" height="66" rx="6" fill="#d9eeeb" stroke="#167779" stroke-width="2"/><text x="570" y="327" font-size="30" fill="#167779" text-anchor="middle" font-weight="bold">11</text><rect x="613" y="283" width="70" height="66" rx="6" fill="white" stroke="#c7cdd0" stroke-width="2"/><text x="648" y="327" font-size="30" fill="#536475" text-anchor="middle" font-weight="normal">12</text><text x="205" y="322" font-size="23" fill="#9b7028" text-anchor="middle" font-weight="normal">index.X = 1</text><text x="612" y="392" font-size="23" fill="#167779" text-anchor="middle" font-weight="normal">index.Y = 0</text><path d="M205 336 V424 H330 V449" fill="none" stroke="#9b7028" stroke-width="3" marker-end="url(#arrow)"/><path d="M612 406 V424 H570 V449" fill="none" stroke="#167779" stroke-width="3" marker-end="url(#arrow)"/><rect x="100" y="455" width="700" height="90" rx="10" fill="#172f46" stroke="#172f46" stroke-width="2"/><text x="450" y="511" font-size="32" fill="#fbf8f0" text-anchor="middle" font-weight="normal">4×7 + 5×9 + 6×11 = 139</text><path d="M450 545 V575" fill="none" stroke="#172f46" stroke-width="3" marker-end="url(#arrow)"/><rect x="200" y="580" width="500" height="76" rx="10" fill="#eee8d8" stroke="#9b7028" stroke-width="2"/><text x="450" y="611" font-size="23" fill="#172f46" text-anchor="middle" font-weight="normal">Output row 1, column 0</text><text x="450" y="643" font-size="27" fill="#9b7028" text-anchor="middle" font-weight="bold">output[2] = 139</text></g></svg>